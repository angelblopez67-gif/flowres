<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Getsi ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Reset y estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030008;
            color: #f3e8ff;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Aplicar tipografía cursiva a todos los textos */
        h1, p, button, .mystic-text, .popup-card p, .letter-card p, .signature, #final-message p {
            font-family: 'Caveat', cursive !important;
            letter-spacing: 0.5px;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
            opacity: 0;
            pointer-events: none;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Fondo de estrellas base muy estrellado */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #15062b 0%, #030008 100%);
        }

        /* Pantalla 1: Inicio Místico */
        #screen-1 .mystic-text {
            font-size: 2.2rem;
            color: #d8b4fe;
            margin-bottom: 30px;
            animation: pulseText 3s infinite ease-in-out;
            text-shadow: 0 0 15px rgba(216, 180, 254, 0.5);
        }

        .star-container {
            position: relative;
            cursor: pointer;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-star {
            font-size: 3rem;
            animation: floatStar 3s infinite ease-in-out, glowSirius 2s infinite alternate;
            filter: drop-shadow(0 0 20px #e9d5ff);
            transition: transform 0.3s ease;
        }

        .main-star:hover {
            transform: scale(1.2);
        }

        /* Pantalla 2 y 3: Ramo Mágico (Animado) */
        .bouquet-wrapper {
            position: relative;
            width: 320px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bouquet-wrapper.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Resplandor trasero que se ilumina al terminar */
        .bouquet-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(216, 180, 254, 0.35) 0%, rgba(168, 85, 247, 0.1) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0;
            transform: scale(0.5);
            transition: all 1.5s ease-out;
            z-index: 1;
        }

        .bouquet-wrapper.illuminated .bouquet-glow {
            opacity: 1;
            transform: scale(1.3);
        }

        /* Partículas de polvo estelar */
        .stardust-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        /* Imagen con efecto de revelado progresivo (florecimiento) */
        .bouquet-img-animated {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            clip-path: inset(100% 0 0 0); /* Empieza oculta abajo */
            transition: clip-path 2s cubic-bezier(0.25, 1, 0.5, 1), filter 1s ease;
            filter: brightness(0.5) blur(4px);
        }

        .bouquet-wrapper.bloomed .bouquet-img-animated {
            clip-path: inset(0 0 0 0); /* Se revela completamente */
            filter: brightness(1) blur(0px);
        }

        .next-step-btn {
            margin-top: 40px;
            background: linear-gradient(135deg, #c084fc, #f472b6);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            opacity: 0;
            transform: translateY(20px);
        }

        .bouquet-wrapper.illuminated + .next-step-btn {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
        }

        .next-step-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.6);
        }

        /* Pantalla 4: Exploración del Cielo */
        .sky-exploration {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 60vh;
        }

        .explore-star {
            position: absolute;
            cursor: pointer;
            background: rgba(216, 180, 254, 0.15);
            border: 2px solid rgba(216, 180, 254, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.3);
        }

        .explore-star:hover {
            background: rgba(216, 180, 254, 0.4);
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(233, 213, 255, 0.8);
        }

        .explore-star.clicked {
            border-color: #f472b6;
            background: rgba(244, 114, 182, 0.3);
        }

        /* Posiciones de las estrellas en el cielo */
        #star-sirio { top: 20%; left: 25%; width: 55px; height: 55px; }
        #star-andromeda { top: 35%; right: 20%; width: 50px; height: 50px; }
        #star-luna { bottom: 30%; left: 15%; width: 50px; height: 50px; }
        #star-fugaz { top: 15%; right: 35%; width: 45px; height: 45px; }
        #star-desconocida { bottom: 20%; right: 25%; width: 55px; height: 55px; }

        .popup-card {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(16, 5, 33, 0.95);
            border: 1px solid rgba(216, 180, 254, 0.3);
            padding: 20px 25px;
            border-radius: 16px;
            max-width: 90%;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .popup-card.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .popup-card p {
            font-size: 1.4rem;
            line-height: 1.5;
            color: #f3e8ff;
            margin-bottom: 15px;
        }

        .close-btn {
            background: #d8b4fe;
            color: #030008;
            border: none;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: #e9d5ff;
        }

        /* Pantalla de Carta */
        .letter-card {
            background: rgba(16, 5, 33, 0.9);
            border: 1px solid rgba(216, 180, 254, 0.2);
            padding: 30px;
            border-radius: 20px;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            text-align: left;
            max-height: 75vh;
            overflow-y: auto;
        }

        .letter-card p {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #e9d5ff;
            margin-bottom: 15px;
        }

        .letter-card .signature {
            text-align: right;
            font-weight: bold;
            font-size: 1.4rem;
            color: #f472b6;
            margin-top: 20px;
        }

        /* Animaciones generales */
        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes floatStar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes glowSirius {
            from { filter: drop-shadow(0 0 10px #d8b4fe); }
            to { filter: drop-shadow(0 0 25px #ffffff); }
        }

        /* Canvas para constelación y efectos fugaces */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <canvas id="fx-canvas"></canvas>

    <!-- PANTALLA 1: Inicio Místico -->
    <div id="screen-1" class="screen active">
        <p class="mystic-text">Tengo algo para ti, Getsi ✨</p>
        <div class="star-container" onclick="goToScreen(2)">
            <div class="main-star">⭐</div>
        </div>
    </div>

    <!-- PANTALLA 2: Ramo Mágico (Animado) -->
    <div id="screen-2" class="screen">
        <div class="bouquet-wrapper" id="bouquetContainer">
            <div class="bouquet-glow"></div>
            <div class="stardust-particles" id="stardust"></div>
            <img src="ramo.png" alt="Ramo Cósmico" class="bouquet-img-animated" id="animatedBouquet">
        </div>
        <button id="after-bouquet-btn" class="next-step-btn" onclick="goToScreen(3)">Explorar el cielo ✨</button>
    </div>

    <!-- PANTALLA 3: Exploración del Cielo -->
    <div id="screen-3" class="screen">
        <div class="sky-exploration">
            <div id="star-sirio" class="explore-star" onclick="openStar('sirio')">⭐</div>
            <div id="star-andromeda" class="explore-star" onclick="openStar('andromeda')">🌌</div>
            <div id="star-luna" class="explore-star" onclick="openStar('luna')">🌙</div>
            <div id="star-fugaz" class="explore-star" onclick="openStar('fugaz')">🌠</div>
            <div id="star-desconocida" class="explore-star" onclick="openStar('desconocida')">💫</div>
        </div>

        <!-- Tarjetas Popups de las Estrellas -->
        <div id="popup-sirio" class="popup-card">
            <p>Hay estrellas que simplemente destacan. Sirio es una de ellas, y tú también destacas con tu propio brillo. ✨</p>
            <button class="close-btn" onclick="closePopup('sirio')">Continuar</button>
        </div>
        <div id="popup-andromeda" class="popup-card">
            <p>Andrómeda guarda historias que llevan siglos viajando

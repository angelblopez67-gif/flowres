<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Getsi ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:#030008; color:#f3e8ff; font-family:'Quicksand',sans-serif; min-height:100vh; overflow:hidden; }
        
        #starfield{ position:fixed; inset:0; width:100%; height:100%; z-index:1; background: radial-gradient(circle at 50% 45%, #241044 0%, #10051f 38%, #030008 78%); }
        #fx-canvas{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:100; }
        h1,p,button,.mystic-text, .popup-card p,.letter-card p, .signature,.side-text,#final-message p{ font-family:'Caveat',cursive !important; letter-spacing:.5px; }

        .screen{ position:absolute; inset:0; width:100%; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; pointer-events:none; transition:opacity 1s ease; padding:20px; text-align:center; }
        .screen.active{ opacity:1; pointer-events:auto; }

        #screen-1{ cursor:pointer; z-index:50; }
        .welcome-title{ font-size:4rem; color:#f5c7ff; margin-bottom:5px; animation:pulseText 2s infinite ease-in-out; text-shadow: 0 0 15px rgba(244,180,255,.7), 0 0 40px rgba(192,132,252,.45); }
        .welcome-subtitle{ font-size:1.8rem; color:#f3dfff; margin-bottom:30px; }
        .click-btn{ background:transparent; border:2px solid #e2b7ff; color:#e2b7ff; padding:10px 30px; border-radius:25px; font-family:'Quicksand',sans-serif !important; font-weight:600; font-size:1rem; letter-spacing:1px; cursor:pointer; box-shadow:0 0 15px rgba(216,180,254,.3); transition:.3s; }
        .click-btn:hover{ background:#d8b4fe; color:#030008; box-shadow: 0 0 25px rgba(216,180,254,.7), 0 0 50px rgba(244,114,182,.35); }

        .garden-scene{ position:relative; width:100%; max-width:900px; height:100vh; display:flex; justify-content:center; align-items:center; z-index:20; }
        
        .cosmic-aura{ position:absolute; left:50%; top:47%; width:320px; height:320px; transform:translate(-50%,-50%) scale(.1); border-radius:50%; background: radial-gradient( circle, rgba(255,210,250,.95) 0%, rgba(232,180,255,.7) 15%, rgba(190,130,255,.4) 35%, rgba(124,58,237,.16) 58%, transparent 72% ); filter:blur(2px); opacity:0; z-index:3; }
        .screen-2-start .cosmic-aura{ animation: cosmicAura 2.2s ease-out 4.0s forwards, cosmicPulse 3s ease-in-out 6s infinite; }
        @keyframes cosmicAura{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.1); } 45%{ opacity:1; transform:translate(-50%,-50%) scale(1.25); } 100%{ opacity:.8; transform:translate(-50%,-50%) scale(1); } }
        @keyframes cosmicPulse{ 0%,100%{ filter:blur(2px); opacity:.65; } 50%{ filter:blur(5px); opacity:.95; transform:translate(-50%,-50%) scale(1.08); } }

        .side-text{ position:absolute; font-size:1.8rem; color:#f3dfff; text-shadow: 0 0 12px rgba(216,180,254,.7), 0 0 25px rgba(244,114,182,.25); opacity:0; max-width:240px; line-height:1.35; z-index:40; }
        .text-left{ left:1%; top:36%; text-align:right; }
        .text-right{ right:1%; bottom:35%; text-align:left; }
        .screen-2-start .text-left{ animation:textAppear 1.5s ease 5.4s forwards; }
        .screen-2-start .text-right{ animation:textAppear 1.5s ease 5.9s forwards; }
        @keyframes textAppear{ from{ opacity:0; transform:translateY(15px); } to{ opacity:1; transform:translateY(0); } }

        .bouquet-wrapper{ position:relative; width:330px; height:440px; display:flex; justify-content:center; align-items:flex-end; z-index:20; }
        .garden-container{ position:relative; width:100%; height:100%; z-index:20; }

        .bouquet-base{ position:absolute; bottom:8px; left:50%; width:135px; height:35px; transform:translateX(-50%) scaleY(0); border-radius:50% 50% 30% 30%; background: linear-gradient( 135deg, #fbcfe8, #f9a8d4, #c084fc ); box-shadow: 0 0 20px rgba(244,114,182,.5), inset 0 0 15px rgba(255,255,255,.3); opacity:0; z-index:30; }
        .screen-2-start .bouquet-base{ animation:baseAppear 1s ease 3.4s forwards; }
        @keyframes baseAppear{ to{ opacity:1; transform:translateX(-50%) scaleY(1); } }

        .stem{ position:absolute; bottom:25px; width:5px; height:0; background: linear-gradient( to top, #be7aa8, #f9a8d4, #fbcfe8 ); border-radius:10px; transform-origin:bottom center; box-shadow: 0 0 7px rgba(244,114,182,.35); z-index:5; }
        .stem-1{left:44%;} .stem-2{left:52%;} .stem-3{left:35%;} .stem-4{left:61%;} .stem-5{left:48%;}
        .screen-2-start .stem-1{ animation:stem1 1.8s cubic-bezier(.2,.9,.2,1) .35s forwards; }
        .screen-2-start .stem-2{ animation:stem2 1.8s cubic-bezier(.2,.9,.2,1) .55s forwards; }
        .screen-2-start .stem-3{ animation:stem3 1.7s cubic-bezier(.2,.9,.2,1) .15s forwards; }
        .screen-2-start .stem-4{ animation:stem4 1.8s cubic-bezier(.2,.9,.2,1) .7s forwards; }
        .screen-2-start .stem-5{ animation:stem5 2s cubic-bezier(.2,.9,.2,1) .9s forwards; }
        @keyframes stem1{ to{ height:185px; transform:rotate(-5deg); } }
        @keyframes stem2{ to{ height:205px; transform:rotate(3deg); } }
        @keyframes stem3{ to{ height:155px; transform:rotate(-15deg); } }
        @keyframes stem4{ to{ height:165px; transform:rotate(15deg); } }
        @keyframes stem5{ to{ height:225px; transform:rotate(0); } }

        .leaf{ position:absolute; width:35px; height:15px; background: linear-gradient( 135deg, #fbcfe8, #e9a6d0 ); border-radius:100% 0 100% 0; opacity:0; }
        .leaf-1{ left:40%; bottom:110px; transform:rotate(-35deg); }
        .leaf-2{ left:54%; bottom:145px; transform:rotate(35deg); }
        .leaf-3{ left:33%; bottom:85px; transform:rotate(-45deg); }
        .leaf-4{ left:62%; bottom:105px; transform:rotate(45deg); }
        .screen-2-start .leaf{ animation:leafAppear .8s ease 2.5s forwards; }
        @keyframes leafAppear{ from{ opacity:0; transform:scale(0); } to{ opacity:.8; } }

        .tulip-head{ position:absolute; width:55px; height:65px; bottom:25px; transform:translateY(40px) scale(.1); transform-origin:bottom center; opacity:0; z-index:12; }
        .head-1{left:calc(44% - 27px);} .head-2{left:calc(52% - 27px);} .head-3{left:calc(35% - 27px);} .head-4{left:calc(61% - 27px);} .head-5{left:calc(48% - 27px);}
        .screen-2-start .head-1{ animation:tulip1 1.4s cubic-bezier(.17,.89,.32,1.25) 1.45s forwards; }
        .screen-2-start .head-2{ animation:tulip2 1.4s cubic-bezier(.17,.89,.32,1.25) 1.65s forwards; }
        .screen-2-start .head-3{ animation:tulip3 1.35s cubic-bezier(.17,.89,.32,1.25) 1.25s forwards; }
        .screen-2-start .head-4{ animation:tulip4 1.35s cubic-bezier(.17,.89,.32,1.25) 1.85s forwards; }
        .screen-2-start .head-5{ animation:tulip5 1.5s cubic-bezier(.17,.89,.32,1.25) 2.05s forwards; }
        @keyframes tulip1{ to{ bottom:180px; opacity:1; transform:rotate(-5deg) scale(1); } }
        @keyframes tulip2{ to{ bottom:200px; opacity:1; transform:rotate(3deg) scale(1); } }
        @keyframes tulip3{ to{ bottom:150px; opacity:1; transform:rotate(-15deg) scale(.92); } }
        @keyframes tulip4{ to{ bottom:160px; opacity:1; transform:rotate(15deg) scale(.94); } }
        @keyframes tulip5{ to{ bottom:220px; opacity:1; transform:scale(1.05); } }

        .tulip-petal{ position:absolute; border-radius: 55% 55% 35% 35%; transform-origin:bottom center; box-shadow: 0 0 10px rgba(244,180,255,.55); }
        .screen-2-start .p-left{ animation:petalLeft .9s ease 2.75s forwards; }
        .screen-2-start .p-right{ animation:petalRight .9s ease 2.75s forwards; }
        .screen-2-start .p-center{ animation:petalCenter 1s ease 2.65s forwards; }
        @keyframes petalLeft{ from{ transform:rotate(-4deg) scaleY(.7); } to{ transform:rotate(-25deg) scaleY(1); } }
        @keyframes petalRight{ from{ transform:rotate(4deg) scaleY(.7); } to{ transform:rotate(25deg) scaleY(1); } }
        @keyframes petalCenter{ from{ transform:scaleY(.7) translateY(5px); } to{ transform:scaleY(1) translateY(0); } }

        .lila-tone .p-center{ background: linear-gradient( 135deg, #e0b5ff, #a855f7, #7e22ce ); width:31px; height:50px; left:12px; top:4px; z-index:3; }
        .lila-tone .p-left, .lila-tone .p-right{ background: linear-gradient( 135deg, #f0d4ff, #c084fc, #9333ea ); width:27px; height:43px; top:12px; z-index:2; }
        .lavender-tone .p-center{ background: linear-gradient( 135deg, #f3dcff, #c084fc, #8b5cf6 ); width:31px; height:50px; left:12px; top:4px; z-index:3; }
        .lavender-tone .p-left, .lavender-tone .p-right{ background: linear-gradient( 135deg, #fae8ff, #d8b4fe, #a855f7 ); width:27px; height:43px; top:12px; z-index:2; }

        .blue-rose{ position:absolute; left:calc(48% - 38px); bottom:235px; width:76px; height:76px; transform:scale(0) rotate(-20deg); opacity:0; z-index:25; filter: drop-shadow(0 0 10px rgba(96,165,250,.8)) drop-shadow(0 0 25px rgba(59,130,246,.45)); }
        .screen-2-start .blue-rose{ animation: roseEntrance 1.5s cubic-bezier(.17,.89,.32,1.3) 3.0s forwards, roseFloat 4s ease-in-out 5s infinite; }
        @keyframes roseEntrance{ 0%{ opacity:0; transform:scale(0) rotate(-30deg); } 70%{ opacity:1; transform:scale(1.15) rotate(5deg); } 100%{ opacity:1; transform:scale(1) rotate(0); } }
        @keyframes roseFloat{ 0%,100%{ margin-top:0; } 50%{ margin-top:-5px; } }
        
        .rose-petal{ position:absolute; width:35px; height:48px; border-radius:50% 50% 45% 45%; background: radial-gradient( circle at 35% 25%, #dbeafe 0%, #93c5fd 20%, #3b82f6 58%, #1d4ed8 100% ); box-shadow: inset 3px 4px 8px rgba(255,255,255,.4), 0 0 8px rgba(96,165,250,.65); }
        .rose-1{ left:20px; top:0; transform:rotate(-25deg); }
        .rose-2{ left:2px; top:18px; transform:rotate(-60deg); }
        .rose-3{ right:2px; top:18px; transform:rotate(60deg); }
        .rose-4{ left:18px; top:28px; transform:rotate(-15deg); }
        .rose-5{ right:18px; top:28px; transform:rotate(15deg); }
        .rose-center{ position:absolute; left:24px; top:21px; width:28px; height:32px; border-radius:50%; background: radial-gradient( circle, #bfdbfe, #60a5fa 45%, #2563eb 100% ); box-shadow: 0 0 10px rgba(147,197,253,.8); }

        .next-step-btn{ position:absolute; bottom:30px; background: linear-gradient( 135deg, #c084fc, #f472b6 ); color:#fff; border:none; padding:10px 25px; border-radius:30px; font-size:1.2rem; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(192,132,252,.4), 0 0 25px rgba(244,114,182,.2); opacity:0; transform:translateY(20px); z-index:50; }
        .screen-2-start .next-step-btn{ animation:buttonAppear 1s ease 6.8s forwards; }
        @keyframes buttonAppear{ to{ opacity:1; transform:translateY(0); } }
        .next-step-btn:hover{ transform:scale(1.05); box-shadow: 0 6px 25px rgba(244,114,182,.7), 0 0 40px rgba(192,132,252,.4); }

        .letter-card{ background:rgba(16,5,33,.9); border:1px solid rgba(216,180,254,.2); padding:25px; border-radius:20px; max-width:440px; width:90%; box-shadow:0 15px 40px rgba(0,0,0,.7); text-align:left; max-height:75vh; overflow-y:auto; z-index:20; }
        .letter-card p{ font-size:1.3rem; line-height:1.5; color:#e9d5ff; margin-bottom:12px; }
        .letter-card .signature{ text-align:right; font-weight:bold; font-size:1.3rem; color:#f472b6; margin-top:15px; }

        /* Botón con la corrección solicitada */
        .extra-btn {
            background: linear-gradient(135deg, #c084fc, #f472b6);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            font-family: 'Caveat', cursive !important;
            box-shadow: 0 0 15px rgba(192,132,252,.4);
        }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <canvas id="fx-canvas"></canvas>

    <!-- PANTALLA 1 -->
    <div id="screen-1" class="screen active" onclick="startExperience()">
        <h1 class="welcome-title">¡Hola!</h1>
        <p class="welcome-subtitle">ESTE DETALLE ES PARA TI :)</p>
        <button class="click-btn">CLICK AQUÍ</button>
    </div>

    <!-- PANTALLA 2 — RAMO CÓSMICO -->
    <div id="screen-2" class="screen">
        <div class="garden-scene">
            <div class="cosmic-aura"></div>
            <div class="side-text text-left">Estos tulipanes lila son un reflejo de la magia que traes a mi vida. ✨</div>
            <div class="bouquet-wrapper">
                <div class="garden-container">
                    <div class="stem stem-1"></div>
                    <div class="stem stem-2"></div>
                    <div class="stem stem-3"></div>
                    <div class="stem stem-4"></div>
                    <div class="stem stem-5"></div>
                    <div class="bouquet-base"></div>
                </div>
            </div>
            <button class="next-step-btn" onclick="goToLetter()">Continuar ✨</button>
        </div>
    </div>

    <!-- PANTALLA DE CARTA -->
    <div id="screen-3" class="screen">
        <div class="letter-card">
            <p>Mi pequeña Getsi,</p>
            <p>Quería hacer algo especial para recordarte lo mucho que significas para mí y la hermosa luz que le regalas a mis días.</p>
            <p class="signature">Tu rabanito</p>
            <!-- Corrección aplicada aquí -->
            <button class="extra-btn" onclick="goToFinal()">Hay algo más para ti mi getsi ❤️</button>
        </div>
    </div>

    <script>
        function startExperience() {
            document.getElementById('screen-1').classList.remove('active');
            const s2 = document.getElementById('screen-2');
            s2.classList.add('active');
            s2.classList.add('screen-2-start');
        }

        function goToLetter() {
            document.getElementById('screen-2').classList.remove('active');
            document.getElementById('screen-3').classList.add('active');
        }

        function goToFinal() {
            // Lógica para avanzar a la siguiente sección si lo requieres
        }
    </script>
</body>
</html>

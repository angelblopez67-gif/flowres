<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Getsi 💜</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#050312;
  color:white;
  font-family:Georgia,serif;
  overflow:hidden;
}

.screen{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:25px;
}

.screen.active{
  display:flex;
}

.stars{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.star{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:.25;transform:scale(.7)}
  to{opacity:1;transform:scale(1.4)}
}

.card{
  width:min(90vw,520px);
  padding:30px 22px;
  border-radius:28px;
  background:rgba(20,15,45,.78);
  border:1px solid rgba(190,160,255,.5);
  box-shadow:0 0 35px rgba(130,90,255,.25);
  backdrop-filter:blur(8px);
}

h1{
  font-size:clamp(30px,8vw,52px);
  margin-bottom:22px;
}

h2{
  font-size:clamp(25px,7vw,40px);
  margin-bottom:18px;
}

p{
  font-size:clamp(18px,5vw,23px);
  line-height:1.6;
  color:#eeeaff;
  margin-bottom:25px;
}

button{
  border:1px solid #c8aaff;
  background:rgba(40,25,75,.8);
  color:white;
  padding:14px 25px;
  border-radius:999px;
  font-size:18px;
  cursor:pointer;
  transition:.25s;
  margin:5px;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #9b70ff;
}

/* FLOR */

  position:relative;
  width:230px;
  height:230px;
  margin:0 auto 25px;
}

.petal{

    0 0 15px #704cff,

.p7{transform:rotate(270deg) translateY(-20px)}
.p8{transform:rotate(315deg) translateY(-20px)}

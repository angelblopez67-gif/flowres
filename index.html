<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Getsi ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030008;
            color: #f3e8ff;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
            opacity: 0;
            pointer-events: none;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #15062b 0%, #030008 100%);
        }

        /* Pantalla de inicio (Hola / Click aquí) */
        #screen-1 {
            cursor: pointer;
            z-index: 50;
        }

        .welcome-title {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            color: #d8b4fe;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: pulseText 2s infinite ease-in-out;
        }

        .welcome-subtitle {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: #e9d5ff;
            margin-bottom: 30px;
        }

        .click-btn {
            background: transparent;
            border: 2px solid #d8b4fe;
            color: #d8b4fe;
            padding: 10px 25px;
            border-radius: 25px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(216, 180, 254, 0.3);
            transition: all 0.3s ease;
        }

        .click-btn:hover {
            background: #d8b4fe;
            color: #030008;
            box-shadow: 0 0 25px rgba(216, 180, 254, 0.6);
        }

        /* Pantalla del Ramo y Textos laterales estilo video */
        .garden-scene {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        /* Textos laterales románticos */
        .side-text {
            position: absolute;
            font-family: 'Caveat', cursive;
            font-size: 1.6rem;
            color: #e9d5ff;
            text-shadow: 0 0 10px rgba(216, 180, 254, 0.5);
            opacity: 0;
            transition: opacity 1.5s ease;
            max-width: 280px;
            line-height: 1.4;
        }

        .text-left {
            left: 5%;
            top: 40%;
            text-align: right;
        }

        .text-right {
            right: 5%;
            bottom: 40%;
            text-align: left;
        }

        .side-text.show {
            opacity: 1;
        }

        /* Contenedor del Ramo Central de Tulipanes Lila/Lavanda */
        .bouquet-wrapper {
            position: relative;
            width: 260px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .starlight-glow {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(216, 180, 254, 0.9) 0%, rgba(168, 85, 247, 0.5) 40%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 15;
            box-shadow: 0 0 50px 25px rgba(216, 180, 254, 0.4);
            animation: burstGlow 1.5s ease-out 0.5s forwards;
        }

        .garden-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 20;
        }

        /* Tallos múltiples juntos */
        .stem {
            position: absolute;
            bottom: 0;
            width: 5px;
            height: 0px;
            background: linear-gradient(to top, #15803d, #22c55e);
            border-radius: 4px;
            transform-origin: bottom center;
            animation: growStem 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .stem-1 { left: 42%; animation-name: growStem1; }
        .stem-2 { left: 50%; animation-name: growStem2; }
        .stem-3 { left: 34%; animation-name: growStem3; }
        .stem-4 { left: 58%; animation-name: growStem4; }
        .stem-5 { left: 46%; animation-name: growStem5; }

        /* Tulipanes Lila y Lavanda */
        .tulip-head {
            position: absolute;
            bottom: 0px;
            width: 50px;
            height: 60px;
            transform: scale(0);
            transform-origin: bottom center;
            animation: bloomTulipGroup 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1s forwards;
        }

        .head-1 { left: calc(42% - 25px); animation-name: bloomTulip1; }
        .head-2 { left: calc(50% - 25px); animation-name: bloomTulip2; }
        .head-3 { left: calc(34% - 25px); animation-name: bloomTulip3; }
        .head-4 { left: calc(58% - 25px); animation-name: bloomTulip4; }
        .head-5 { left: calc(46% - 25px); animation-name: bloomTulip5; }

        .tulip-petal {
            position: absolute;
            border-radius: 50% 50% 40% 40%;
            box-shadow: 0 0 12px rgba(216, 180, 254, 0.7);
        }

        /* Tonos Lila y Lavanda elegante */
        .lavender-tone .p-center { background: linear-gradient(135deg, #d8b4fe, #a855f7); width: 28px; height: 46px; left: 11px; top: 4px; z-index: 3; }
        .lavender-tone .p-left { background: linear-gradient(135deg, #e9d5ff, #c084fc); width: 24px; height: 40px; left: 2px; top: 10px; transform: rotate(-18deg); z-index: 2; }
        .lavender-tone .p-right { background: linear-gradient(135deg, #e9d5ff, #c084fc); width: 24px; height: 40px; right: 2px; top: 10px; transform: rotate(18deg); z-index: 2; }

        .lila-tone .p-center { background: linear-gradient(135deg, #c084fc, #7e22ce); width: 28px; height: 46px; left: 11px; top: 4px; z-index: 3; }
        .lila-tone .p-left { background: linear-gradient(135deg, #d8b4fe, #9333ea); width: 24px; height: 40px; left: 2px; top: 10px; transform: rotate(-18deg); z-index: 2; }
        .lila-tone .p-right { background: linear-gradient(135deg, #d8b4fe, #9333ea); width: 24px; height: 40px; right: 2px; top: 10px; transform: rotate(18deg); z-index: 2; }

        /* Animaciones de crecimiento conjunto */
        @keyframes growStem1 { 0% { height: 0px; } 100% { height: 180px; transform: rotate(-4deg); } }
        @keyframes growStem2 { 0% { height: 0px; } 100% { height: 195px; transform: rotate(2deg); } }
        @keyframes growStem3 { 0% { height: 0px; } 100% { height: 155px; transform: rotate(-14deg); } }
        @keyframes growStem4 { 0% { height: 0px; } 100% { height: 160px; transform: rotate(15deg); } }
        @keyframes growStem5 { 0% { height: 0px; } 100% { height: 210px; transform: rotate(0deg); } }

        @keyframes bloomTulip1 { 0% { bottom: 0px; transform: scale(0) rotate(-4deg); } 100% { bottom: 170px; transform: scale(1) rotate(-4deg); } }
        @keyframes bloomTulip2 { 0% { bottom: 0px; transform: scale(0) rotate(2deg); } 100% { bottom: 185px; transform: scale(1) rotate(2deg); } }
        @keyframes bloomTulip3 { 0% { bottom: 0px; transform: scale(0) rotate(-14deg); } 100% { bottom: 145px; transform: scale(1) rotate(-14deg); } }
        @keyframes bloomTulip4 { 0% { bottom: 0px; transform: scale(0) rotate(15deg); } 100% { bottom: 150px; transform: scale(1) rotate(15deg); } }
        @keyframes bloomTulip5 { 0% { bottom: 0px; transform: scale(0) rotate(0deg); } 100% { bottom: 200px; transform: scale(1) rotate(0deg); } }

        @keyframes burstGlow {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>

    <!-- PANTALLA 1: INICIO (Estilo Hola / Click Aquí) -->
    <div id="screen-1" class="screen active" onclick="startExperience()">
        <h1 class="welcome-title">¡Hola!</h1>
        <p class="welcome-subtitle">ESTE DETALLE ES PARA TI :)</p>
        <button class="click-btn">CLICK AQUÍ</button>
    </div>

    <!-- PANTALLA 2: RAMO DE TULIPANES LILA/LAVANDA CON TEXTOS LATERALES -->
    <div id="screen-2" class="screen">
        <div class="garden-scene">
            <div class="side-text text-left" id="textLeft">
                Estos tulipanes lila son un reflejo de la magia que traes a mi vida. ✨
            </div>

            <div class="bouquet-wrapper">
                <div class="starlight-glow"></div>
                <div class="garden-container">
                    <!-- Tallos en racimo -->
                    <div class="stem stem-1"></div>
                    <div class="stem stem-2"></div>
                    <div class="stem stem-3"></div>
                    <div class="stem stem-4"></div>
                    <div class="stem stem-5"></div>

                    <!-- Tulipanes Lila y Lavanda agrupados -->
                    <div class="tulip-head head-1 lavender-tone">
                        <div class="tulip-petal p-left"></div>
                        <div class="tulip-petal p-right"></div>
                        <div class="tulip-petal p-center"></div>
                    </div>
                    <div class="tulip-head head-2 lila-tone">
                        <div class="tulip-petal p-left"></div>
                        <div class="tulip-petal p-right"></div>
                        <div class="tulip-petal p-center"></div>
                    </div>
                    <div class="tulip-head head-3 lila-tone">
                        <div class="tulip-petal p-left"></div>
                        <div class="tulip-petal p-right"></div>
                        <div class="tulip-petal p-center"></div>
                    </div>
                    <div class="tulip-head head-4 lavender-tone">
                        <div class="tulip-petal p-left"></div>
                        <div class="tulip-petal p-right"></div>
                        <div class="tulip-petal p-center"></div>
                    </div>
                    <div class="tulip-head head-5 lila-tone">
                        <div class="tulip-petal p-left"></div>
                        <div class="tulip-petal p-right"></div>
                        <div class="tulip-petal p-center"></div>
                    </div>
                </div>
            </div>

            <div class="side-text text-right" id="textRight">
                Gracias por iluminar mis días con tu presencia. 💜
            </div>
        </div>
    </div>

    <script>
        // Fondo de estrellas parpadeantes
        const starCanvas = document.getElementById('starfield');
        const starCtx = starCanvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function animateStars() {
            starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            starCtx.fillStyle = '#ffffff';
            stars.forEach(s => {
                starCtx.globalAlpha = s.alpha;
                starCtx.beginPath();
                starCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                starCtx.fill();
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // Control de transición y aparición de textos al compás del ramo
        function startExperience() {
            document.getElementById('screen-1').classList.remove('active');
            document.getElementById('screen-2').classList.add('active');

            // Mostrar el texto izquierdo al iniciar el crecimiento
            setTimeout(() => {
                document.getElementById('textLeft').classList.add('show');
            }, 600);

            // Mostrar el texto derecho cuando los tulipanes terminan de abrirse
            setTimeout(() => {
                document.getElementById('textRight').classList.add('show');
            }, 1400);
        }
    </script>
</body>
</html>

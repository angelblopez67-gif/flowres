ier(.2,.9,.2,1) .7s forwards; } .screen-2-start .stem-5{ animation:stem5 2s cubic-bezier(.2,.9,.2,1) .9s forwards; } @keyframes stem1{ to{ height:185px; transform:rotate(-5deg); } } @keyframes stem2{ to{ height:205px; transform:rotate(3deg); } } @keyframes stem3{ to{ height:155px; transform:rotate(-15deg); } } @keyframes stem4{ to{ height:165px; transform:rotate(15deg); } } @keyframes stem5{ to{ height:225px; transform:rotate(0); } } /* ========================================================= HOJAS ========================================================= */ .leaf{ position:absolute; width:35px; height:15px; background: linear-gradient( 135deg, #fbcfe8, #e9a6d0 ); border-radius:100% 0 100% 0; opacity:0; } .leaf-1{ left:40%; bottom:110px; transform:rotate(-35deg); } .leaf-2{ left:54%; bottom:145px; transform:rotate(35deg); } .leaf-3{ left:33%; bottom:85px; transform:rotate(-45deg); } .leaf-4{ left:62%; bottom:105px; transform:rotate(45deg); } .screen-2-start .leaf{ animation:leafAppear .8s ease 2.5s forwards; } @keyframes leafAppear{ from{ opacity:0; transform:scale(0); } to{ opacity:.8; } } /* ========================================================= TULIPANES ========================================================= */ .tulip-head{ position:absolute; width:55px; height:65px; bottom:25px; transform:translateY(40px) scale(.1); transform-origin:bottom center; opacity:0; z-index:12; } .head-1{left:calc(44% - 27px);} .head-2{left:calc(52% - 27px);} .head-3{left:calc(35% - 27px);} .head-4{left:calc(61% - 27px);} .head-5{left:calc(48% - 27px);} /* Entrada */ .screen-2-start .head-1{ animation:tulip1 1.4s cubic-bezier(.17,.89,.32,1.25) 1.45s forwards; } .screen-2-start .head-2{ animation:tulip2 1.4s cubic-bezier(.17,.89,.32,1.25) 1.65s forwards; } .screen-2-start .head-3{ animation:tulip3 1.35s cubic-bezier(.17,.89,.32,1.25) 1.25s forwards; } .screen-2-start .head-4{ animation:tulip4 1.35s cubic-bezier(.17,.89,.32,1.25) 1.85s forwards; } .screen-2-start .head-5{ animation :rotate(0) scale(1); } } .lavender-stem{ position:absolute; left:50%; bottom:0; width:3px; height:140px; background: linear-gradient( to top, #f9a8d4, #fbcfe8 ); border-radius:5px; } .lavender-flower{ position:absolute; width:12px; height:22px; border-radius:50%; background: linear-gradient( to bottom, #e9d5ff, #a855f7 ); box-shadow:0 0 8px rgba(192,132,252,.6); } /* posiciones */ .lv1{left:25px;bottom:105px;} .lv2{left:16px;bottom:85px;} .lv3{left:30px;bottom:65px;} .lv4{left:12px;bottom:45px;} .lv5{left:35px;bottom:95px;} .lv6{left:40px;bottom:72px;} .lv7{left:20px;bottom:120px;} .lv8{left:42px;bottom:110px;} /* ========================================================= FLORES DE CEREZO ========================================================= */ .sakura{ position:absolute; width:52px; height:52px; transform:scale(0); opacity:0; z-index:18; } .sakura-1{ left:7%; top:25%; } .sakura-2{ right:5%; top:28%; } .sakura-3{ right:10%; bottom:27%; } .screen-2-start .sakura{ animation:sakuraBloom 1s cubic-bezier(.17,.89,.32,1.3) 3.15s forwards; } @keyframes sakuraBloom{ 0%{ opacity:0; transform:scale(0) rotate(-30deg); } 70%{ opacity:1; transform:scale(1.15) rotate(5deg); } 100%{ opacity:1; transform:scale(1) rotate(0); } } .sakura-petal{ position:absolute; width:17px; height:25px; background: linear-gradient( 135deg, #fce7f3, #f9a8d4 ); border-radius:60% 60% 30% 30%; box-shadow: 0 0 8px rgba(244,114,182,.55); } .sakura-p1{ left:17px; top:0; } .sakura-p2{ left:0; top:17px; transform:rotate(-72deg); } .sakura-p3{ right:0; top:17px; transform:rotate(72deg); } .sakura-p4{ left:9px; bottom:0; transform:rotate(180deg); } .sakura-p5{ right:9px; bottom:0; transform:rotate(180deg); } .sakura-center{ position:absolute; left:21px; top:20px; width:11px; height:11px; background:#fde68a; border-radius:50%; box-shadow:0 0 8px #fef08a; } /* ========================================================= POLVO ESTELAR ========================================================= */ .star-dust{ position:absolute; left:50%; top:48%; width:20px; height:20px; transform:translate(-50%,-50%); pointer-events:none; z-index:70; } .dust-particle{ position:absolute; left:50%; top:50%; width:4px; height:4px; border-radius:50%; background:#fff; box-shadow: 0 0 6px #fff, 0 0 14px #e9d5ff, 0 0 22px #f9a8d4; opacity:0; } /* partículas individuales */ .screen-2-start .dust-particle{ animation:starDust 1.8s cubic-bezier(.1,.7,.2,1) 4s forwards; } @keyframes starDust{ 0%{ opacity:0; transform:translate(-50%,-50%) scale(.2); } 12%{ opacity:1; } 100%{ opacity:0; transform: translate( calc(-50% + var(--x)), calc(-50% + var(--y)) ) scale(var(--s)); } } /* ========================================================= BOTÓN ========================================================= */ .next-step-btn{ position:absolute; bottom:30px; background: linear-gradient( 135deg, #c084fc, #f472b6 ); color:#fff; border:none; padding:10px 25px; border-radius:30px; font-size:1.2rem; font-weight:bold; cursor:pointer; box-shadow: 0 4px 15px rgba(192,132,252,.4), 0 0 25px rgba(244,114,182,.2); opacity:0; transform:translateY(20px); z-index:50; } .screen-2-start .next-step-btn{ animation:buttonAppear 1s ease 6.8s forwards; } @keyframes buttonAppear{ to{ opacity:1; transform:translateY(0); } } .next-step-btn:hover{ transform:scale(1.05); box-shadow: 0 6px 25px rgba(244,114,182,.7), 0 0 40px rgba(192,132,252,.4); } /* ========================================================= PANTALLA 3 ========================================================= */ .sky-exploration{ position:relative; width:100%; max-width:450px; height:55vh; z-index:20; } .explore-star{ position:absolute; cursor:pointer; background:rgba(216,180,254,.15); border:2px solid rgba(216,180,254,.6); border-radius:50%; display:flex; justify-content:center; align-items:center; font-size:1.4rem; transition:.4s; box-shadow:0 0 15px rgba(216,180,254,.3); z-index:25; } .explore-star:hover{ transform:scale(1.15); box-shadow: 0 0 25px rgba(244,114,182,.7), 0 0 4
